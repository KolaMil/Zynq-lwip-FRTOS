# OpenOCD для Digilent JTAG + Zynq-7000 PS.
# Запуск:  openocd -f openocd/zynq7000.cfg

# Штатный digilent-hs2.cfg ищет "Digilent Adept USB Device", а этот адаптер
# представляется как "Digilent USB Device". Серийник держит OpenOCD от CP210x
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
adapter serial "210251A08870"

ftdi channel 0
# Раскладка из digilent_jtag_smt2_nc.cfg. Если цепочка не читается,
# попробовать вариант JTAG-HS3:  ftdi layout_init 0x2088 0x308b
ftdi layout_init 0x00e8 0x60eb

reset_config none

# Копия штатного target/zynq_7000.cfg с двумя правками: добавлен IDCODE
# 0x1372c093 (XC7Z030, в штатном списке её нет) и убран target smp -
# OpenOCD 0.12 падает в resume, а прошивка работает только на CPU0
source [file join [file dirname [info script]] zynq_7030.cfg]

targets zynq.cpu0

# gdb_port не задаём: CLion передаёт свой через -c
source [file join [file dirname [info script]] ps7_init_shim.tcl]

# ORIGIN ps7_ddr_0 из lscript.ld. Процедура, а не переменная: "$::name"
# в Jim Tcl ненадёжен
proc zynq_app_entry {} {
    return 0x00100000
}

# Линии сброса нет, CPSR и кэши переживают прошлый запуск. 0x1D3 - Supervisor
# с масками A/I/F, как после подачи питания; биты SCTLR M/C/I гасим
proc zynq_cpu0_reset_state {} {
    reg cpsr 0x1d3
    set sctlr [arm mrc 15 0 1 0 0]
    arm mcr 15 0 1 0 0 [expr {$sctlr & ~((1 << 0) | (1 << 2) | (1 << 12))}]
}

# Разблокировать SLCR, взвести биты сброса, снять. Как XSlcr_EmacPsReset()
proc zynq_slcr_reset_pulse {name addr val} {
    write_memory 0xF8000008 32 [list 0x0000DF0D]
    set cur [lindex [read_memory $addr 32 1] 0]
    write_memory $addr 32 [list [expr {($cur | $val) & 0xFFFFFFFF}]]
    set cur [lindex [read_memory $addr 32 1] 0]
    write_memory $addr 32 [list [expr {($cur & ~$val) & 0xFFFFFFFF}]]
    echo "zynq_periph_reset:   $name"
}

# GEM продолжает писать DMA в DDR поверх загружаемого образа. Адреса из
# xil_misc_psreset_api.h. UART не трогаем - пропадёт консоль.
# PSS_RST_CTRL не годится, вешает отладку CPU0 - см. README
proc zynq_periph_reset {} {
    if {[catch {halt} err]} {
        echo "zynq_periph_reset: cannot halt CPU0 ($err), skipping"
        return
    }
    echo "zynq_periph_reset: pulsing SLCR peripheral resets"
    catch {zynq_slcr_reset_pulse "GEM (Ethernet), 0xF8000214" 0xF8000214 0xF3}
    catch {zynq_slcr_reset_pulse "DMAC, 0xF800020C"           0xF800020C 0x01}
    return
}

# Порядок как в SDK: ps7_init до очистки матрицы сбивает тактовые частоты
proc zynq_bringup {} {
    halt
    zynq_load_bitstream
    zynq_ps7_init
    zynq_ps7_post_config
}

# Штатный program делает reset init + flash write_image, оба не подходят.
# init вызываем сами: CLion дописывает аргументы после -f
proc program {filename args} {
    set do_exit 0
    foreach arg $args {
        if {$arg eq "exit"} {
            set do_exit 1
        }
    }

    if {[catch {init}] != 0} {
        echo "** OpenOCD init failed **"
        shutdown error
    }

    if {![info exists ::env(ZYNQ_NO_PERIPH_RESET)]} {
        zynq_periph_reset
    }

    zynq_bringup

    # Строго до записи образа: DAP не когерентен кэшам, грязные строки
    # вытесняются поверх свежего кода, а verify_image читает тоже через DAP
    zynq_cpu0_reset_state

    load_image $filename
    verify_image $filename
    reg pc [zynq_app_entry]

    # main() будит CPU1 по 0x10000000, куда ничего не загружено: пишем "b "."" 
    mww 0x10000000 0xEAFFFFFE

    echo "program: loaded and verified [file tail $filename], CPU1 parked"

    # Запускаем здесь: линии сброса нет, reset для этого не годится
    resume
    if {$do_exit} {
        shutdown
    }
}
